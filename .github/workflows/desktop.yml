name: Build RPG Pocket Editor for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Runs the desktop build for real (software OpenGL in a virtual display) and screenshots a tour of the app.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p desktop installDist --stacktrace
      - name: Run and screenshot (Xvfb + Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" desktop/build/install/RPGPocketEditor/bin/RPGPocketEditor --shots shots
          ls -la shots
          if [ -f shots/appdata/crash.txt ]; then cat shots/appdata/crash.txt; fi
          for f in shots/*.png; do base64 -w 3000 "$f" | sed "s|^|SHOT $f |"; done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: shots/*.png
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p desktop installDist --stacktrace
      - name: Package (bundled Java runtime, RPGPocketEditor.exe)
        shell: pwsh
        run: |
          jpackage --type app-image --name RPGPocketEditor --app-version 0.5.0 --vendor HarlequinXD `
            --description "RPG Pocket Editor" --icon desktop/icon.ico `
            --input desktop/build/install/RPGPocketEditor/lib --main-jar RPGPocketEditor.jar `
            --main-class com.retro.doomeditor.DesktopMain --java-options "-Xmx2g" --dest dist
          Compress-Archive -Path dist/RPGPocketEditor -DestinationPath RPGPocketEditor-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RPGPocketEditor-windows
          path: RPGPocketEditor-windows.zip
          if-no-files-found: error
